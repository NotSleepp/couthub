    <text x="76" y="316" fill="#B8A8FF" font-size="47" font-weight="750" letter-spacing="-1.7">en un solo espacio.</text>
    <text x="78" y="364" fill="#B4B8CD" font-size="17">Codex, ChatGPT, correo y proyectos.</text>
    <text x="78" y="390" fill="#B4B8CD" font-size="17">Perfiles separados. Todo bajo tu control.</text>

