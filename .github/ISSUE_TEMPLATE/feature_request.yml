name: Proponer una mejora
description: Describí el problema y la mejora que te gustaría ver.
title: "[Mejora]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué problema querés resolver?
      description: Contanos qué tarea resulta difícil o imposible actualmente.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: ¿Qué comportamiento proponés?
      description: Describí cómo debería funcionar desde el punto de vista de quien usa la aplicación.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas (opcional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: No incluí contraseñas, tokens, cookies ni datos personales de cuentas reales.
          required: true
