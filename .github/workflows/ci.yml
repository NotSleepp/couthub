name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and integration tests
        shell: pwsh
        run: |
          $testFiles = @(
            'tests/browser-launcher.test.js',
            'tests/database.test.js',
            'tests/git.test.js',
            'tests/integration.test.js'
          )

          foreach ($testFile in $testFiles) {
            "### $testFile" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $output = & node --test $testFile 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

            if ($exitCode -ne 0) {
              foreach ($line in ($output | Select-Object -Last 30)) {
                $message = ([string]$line).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=$testFile::$message"
              }
              exit $exitCode
            }
          }

      - name: Build the web interface
        run: npm run build:vite

      - name: Verify the desktop app
        run: npm run test:desktop

      - name: Verify the development web app
        run: npm run test:web

      - name: Verify the production web server
        run: npm run test:web:production

      - name: Verify isolated Chrome profiles
        run: npm run test:browser
