name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build the web interface
        run: npm run build:vite

      - name: Verify the desktop app
        run: npm run test:desktop

      - name: Verify the development web app
        run: npm run test:web

      - name: Verify the production web server
        run: npm run test:web:production

      - name: Verify isolated Chrome profiles
        run: npm run test:browser
