    <text x="143" y="92" fill="#F7F6FF" font-size="21" font-weight="700" letter-spacing=".4">ACCOUNT HUB</text>
    <text x="143" y="112" fill="#9DA2BD" font-size="12" letter-spacing="1.6">TU ESPACIO DE TRABAJO LOCAL</text>

    <rect x="78" y="166" width="232" height="31" rx="15.5" fill="#292649" stroke="#4C427F"/>
    <circle cx="96" cy="181.5" r="4" fill="url(#mint)"/>
    <text x="108" y="186" fill="#CBC5FF" font-size="11" font-weight="650" letter-spacing="1.3">CODIGO ABIERTO · LICENCIA MIT</text>

